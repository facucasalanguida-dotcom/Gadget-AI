; PlatformIO project for the Freenove CYD (ESP32-S3, 3.5" IPS capacitive touch)
; Pins/ICs below are PLACEHOLDERS pending confirmation — see docs/hardware-notes.md.

[env:esp32-s3-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_SUPPORT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -mfix-esp32-psram-cache-issue
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

[env:native-sim]
; Placeholder target for the LVGL PC simulator (see sim/). Firmware UI logic that does
; not touch real hardware peripherals should be structured to also build here.
platform = native
build_flags =
    -D UNIT_TEST
    -D NATIVE_SIM
